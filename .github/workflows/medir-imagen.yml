name: Medir imagen
on:
  push:
    paths:
      - .github/workflows/medir-imagen.yml
jobs:
  medir:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nombre: [slim-trixie, trixie, slim-bookworm, cargo-chef]
    env:
      IMG: ${{ secrets.DOCKERHUB_USERNAME }}/biovigia:medir-${{ matrix.nombre }}
    steps:
      - name: Pull y tamaño
        run: |
          TIMEFORMAT='%R s'
          echo "== ${{ matrix.nombre }}"
          for i in 1 2 3; do
            docker system prune -af >/dev/null
            echo "pull $i:"
            time docker pull -q "$IMG" >/dev/null
            docker image inspect "$IMG" --format 'tamaño: {{.Size}} bytes'
          done