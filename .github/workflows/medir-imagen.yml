name: Medir imagen
on:
  push:
    paths:
      - .github/workflows/medir-imagen.yml
jobs:
  construir:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: slim-trixie
            base: rust:slim-trixie
          - nombre: trixie
            base: rust:trixie
          - nombre: slim-bookworm
            base: rust:slim-bookworm
          - nombre: cargo-chef
            base: lukemathwalker/cargo-chef:latest
          - nombre: cimg
            base: cimg/rust:1.100.0
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: BASE_IMAGE=${{ matrix.base }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/biovigia:medir-${{ matrix.nombre }}
  medir:
    needs: construir
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nombre: [slim-trixie, trixie, slim-bookworm, cargo-chef, cimg]
    env:
      IMG: ${{ secrets.DOCKERHUB_USERNAME }}/biovigia:medir-${{ matrix.nombre }}
    steps:
      - name: Pull y tamaño
        run: |
          TIMEFORMAT='%R s'
          echo "== ${{ matrix.nombre }}"
          for i in 1 2 3; do
            docker system prune -af >/dev/null
            echo "pull $i:"
            time docker pull -q "$IMG" >/dev/null
            docker image inspect "$IMG" --format 'tamaño: {{.Size}} bytes'
          done